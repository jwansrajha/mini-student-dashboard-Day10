# Connect to a PostgreSQL database named student_demo.
# Password is read from an environment variable, not saved in Git.
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/student_demo}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Run schema.sql and data.sql at startup (also for PostgreSQL).
spring.sql.init.mode=always
